{% set name = "ChessAnalysisPipeline" %}
{% set version = "2026.10.20" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/2d/88/3928ea258b8bd3c3b4bb8696e59bd7b27aa2da0130e8958c25d247cf6162/chessanalysispipeline-{{ version }}.tar.gz
  sha256: c565889364f2682269dead45e21e444aa0e9eb04e1b279d09b0b75a9d25334ea

build:
  entry_points:
    - CHAP = CHAP.runner:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy
    - pydantic
    - pyyaml

test:
  imports:
    - CHAP
  commands:
    - pip check
    - CHAP --help
  requires:
    - python {{ python_min }}
    - pip
    - numpy
    - pydantic
    - pyyaml

about:
  home: https://github.com/CHESSComputing/ChessAnalysisPipeline
  summary: CHESS analysis pipeline framework
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/CHESSComputing/ChessAnalysisPipeline

extra:
  recipe-maintainers:
    - keara-soloway
    - rolfverberg
